<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#9B82FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark background -->
  <rect width="1200" height="630" fill="#0A0A0B"/>

  <!-- Soft violet glow behind the logo -->
  <circle cx="600" cy="315" r="320" fill="url(#glow)"/>

  <!-- Rounded violet square, perfectly centered -->
  <rect x="420" y="135" width="360" height="360" rx="84" fill="url(#logoGradient)"/>

  <!-- Bold white letter N (drawn as strokes for consistent rendering everywhere) -->
  <path d="M 528 408 L 528 222 L 672 408 L 672 222"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="44"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
